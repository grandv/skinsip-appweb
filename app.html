<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e6f0fc">
<title>SKINSIP Web App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
/* VOICE everyday product app, calm and clinical, friendly not loud
   IDEA a pharmacy-grade skincare tube label: cobalt field, white label, one coral mark
   PICTURE the gel tube and mousse bottle drawn large on the home card
   COLOUR white ground, cobalt #1f3f9a dominant, mint #d9f4ec support, coral #ff5a4e accent
   TYPE Prompt 700 for titles + IBM Plex Sans Thai for text
   LAYOUT one phone-width column; on laptop the app sits centred like a device */
:root{color-scheme:light dark;--bg:light-dark(#eef0f7,#0b0f24);--app:light-dark(#ffffff,#121834);--ink:light-dark(#10163a,#eef1ff);--mute:light-dark(#5a6283,#a3abcf);--line:light-dark(#e2e5f0,#273055);--co:#1f3f9a;--co2:light-dark(#e8ecff,#1d2756);--mint:light-dark(#d9f4ec,#143a33);--coral:#ff5a4e;--card:light-dark(#f6f7fc,#19203f)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans Thai",system-ui,sans-serif;overflow-x:clip}
button,input,select{font:inherit;color:inherit}
.app{max-width:440px;margin:0 auto;min-height:100%;background:var(--app);position:relative;display:flex;flex-direction:column}
@media(min-width:700px){.app{margin:24px auto;min-height:calc(100% - 48px);border-radius:28px;box-shadow:0 10px 40px rgba(16,22,58,.15);overflow:hidden}}
main{flex:1;padding:16px 16px 96px;overflow-y:auto}
h1,h2,h3{font-family:Prompt,"IBM Plex Sans Thai",sans-serif;margin:0;line-height:1.15;letter-spacing:-.01em}
h1{font-size:28px}h2{font-size:20px;margin:22px 0 10px}h3{font-size:16px}
p{margin:6px 0}.mute{color:var(--mute);font-size:14px}.small{font-size:13px;color:var(--mute)}
.top{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--app);position:sticky;top:0;z-index:5}
.top h3{flex:1}
.back{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--app);cursor:pointer;font-size:18px}
.btn{display:block;width:100%;min-height:50px;border:0;border-radius:14px;background:var(--co);color:#fff;font-weight:600;font-size:16px;cursor:pointer;margin-top:14px}
.btn.line{background:#06c755}.btn.ghost{background:var(--co2);color:var(--co)}
:root[data-theme=dark] .btn.ghost{color:#c9d2ff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.back:focus-visible,.chip:focus-visible,.nav button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
label{display:block;font-size:14px;font-weight:500;margin:14px 0 6px}
input,select{width:100%;min-height:48px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:16px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:10px 0;font-weight:400}
.check input{width:22px;height:22px;min-height:0;flex:none;margin-top:1px;accent-color:var(--co)}
.hero{background:var(--co);color:#fff;border-radius:22px;padding:18px;position:relative;overflow:hidden;min-height:210px}
.hero h1{font-size:26px;max-width:60%}
.hero p{max-width:58%;font-size:14px;opacity:.9}
.hero svg{position:absolute;right:-6px;bottom:-4px;width:46%;height:100%}
.hero .btn{width:auto;display:inline-block;padding:0 18px;background:#fff;color:var(--co);min-height:44px;margin-top:12px}
.member{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.av{width:44px;height:44px;border-radius:50%;background:var(--mint);display:grid;place-items:center;font-family:Prompt;font-weight:700;color:var(--co)}
.tier{font-size:12px;font-weight:600;color:var(--coral)}
.credit{display:flex;justify-content:space-between;align-items:center;border:1px dashed var(--line);border-radius:14px;padding:10px 14px;margin:14px 0 4px;font-size:14px;color:var(--mute)}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}
.quick button{border:0;background:var(--card);border-radius:16px;padding:12px 4px;cursor:pointer;font-size:13px;min-height:84px}
.quick svg{width:28px;height:28px;display:block;margin:0 auto 6px;color:var(--co)}
:root[data-theme=dark] .quick svg{color:#9fb0ff}
.plist{display:grid;gap:10px}
.prod{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--card);border-radius:16px;padding:10px;cursor:pointer;border:0;text-align:left;width:100%}
.thumb{width:84px;height:84px;border-radius:12px;background:var(--co2);display:grid;place-items:center}
.thumb svg{width:70px;height:70px}
.price{font-family:Prompt;font-weight:700;white-space:nowrap}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--mint);color:var(--ink);margin-top:4px}
.add{width:44px;height:44px;border-radius:50%;border:0;background:var(--co);color:#fff;font-size:22px;cursor:pointer}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.row b{white-space:nowrap}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--app);cursor:pointer}
.big{background:var(--co2);border-radius:20px;height:220px;display:grid;place-items:center}.big svg{height:190px}
.nav{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--app);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}
.nav button{border:0;background:none;padding:8px 2px 10px;font-size:12px;color:var(--mute);cursor:pointer;min-height:58px}
.nav button svg{width:24px;height:24px;display:block;margin:0 auto 2px}
.nav button.on{color:var(--co);font-weight:600}
:root[data-theme=dark] .nav button.on{color:#9fb0ff}
.badge{position:absolute;margin-left:12px;margin-top:-30px;background:var(--coral);color:#fff;border-radius:99px;font-size:11px;padding:0 6px}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:84%;padding:10px 14px;border-radius:18px;font-size:15px}
.bot{background:var(--card);border-bottom-left-radius:6px;align-self:flex-start}
.me{background:var(--co);color:#fff;border-bottom-right-radius:6px;align-self:flex-end}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chip{border:1px solid var(--co);color:var(--co);background:var(--app);border-radius:99px;padding:8px 14px;cursor:pointer;font-size:14px;min-height:40px}
:root[data-theme=dark] .chip{color:#c9d2ff;border-color:#6d80ff}
.rec{background:var(--app);border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:8px}
.refer{background:var(--mint);border-radius:16px;padding:12px;margin-top:8px}
.clips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.clip{aspect-ratio:9/14;border-radius:16px;background:linear-gradient(160deg,var(--co),#5b74ff);color:#fff;padding:10px;display:flex;flex-direction:column;justify-content:space-between;position:relative}
.clip .pl{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;align-self:center}
.clip span{font-size:12px;background:rgba(0,0,0,.25);padding:2px 8px;border-radius:99px;align-self:flex-start}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}.filters .chip{flex:none}
.chip.on{background:var(--co);color:#fff}
.menu button{display:flex;justify-content:space-between;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:16px 4px;cursor:pointer;text-align:left;min-height:56px}
.ok{text-align:center;padding:30px 10px}.ok .ring{width:84px;height:84px;border-radius:50%;background:var(--mint);display:grid;place-items:center;margin:0 auto 14px;font-size:38px;color:var(--co)}
.otp{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}.otp input{text-align:center;font-size:22px;padding:0}
.steps{height:5px;background:var(--line);border-radius:9px;margin:4px 0 16px}.steps i{display:block;height:100%;background:var(--coral);border-radius:9px}
.note{font-size:12px;color:var(--mute);text-align:center;margin-top:18px}
.slider{position:relative}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;scrollbar-width:none;border-radius:22px}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;border-radius:22px;color:#fff;position:relative;overflow:hidden;min-height:210px;padding:18px}
.slide svg,.slide img{position:absolute;right:-6px;bottom:-4px;width:46%;height:100%;object-fit:contain;object-position:bottom right}
.slide .sc{position:relative;max-width:58%}
.slide h1{font-size:24px}.slide p{font-size:14px;opacity:.92}
.sbtn{margin-top:12px;min-height:44px;padding:0 18px;border:0;border-radius:14px;background:#fff;color:#10163a;font-weight:600;cursor:pointer}
.dots{display:flex;justify-content:center;gap:4px;margin-top:6px}
.dot{width:28px;height:28px;border:0;background:none;cursor:pointer;position:relative}
.dot::after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:9px;background:var(--line);transform:translate(-50%,-50%);transition:width .2s}
.dot.on::after{width:20px;background:var(--co)}
@media(prefers-reduced-motion:reduce){.dot::after{transition:none}}
.fab{position:sticky;bottom:72px;margin:-64px 16px 8px auto;display:flex;align-items:center;gap:6px;height:52px;padding:0 18px;border:0;border-radius:99px;background:var(--coral);color:#fff;font-weight:600;box-shadow:0 6px 18px rgba(255,90,78,.35);cursor:pointer;z-index:4}
.fab svg{width:22px;height:22px}
.scrim{position:fixed;inset:0;background:rgba(10,14,36,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.scrim[hidden]{display:none}
.sheet{background:var(--app);width:100%;max-width:440px;border-radius:24px 24px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px;margin-top:10px;cursor:pointer;min-height:64px}
.opt small{display:block;color:var(--mute);font-size:13px}
.oi{flex:none;width:40px;height:40px;border-radius:12px;background:var(--co);color:#fff;display:grid;place-items:center;font-family:Prompt;font-weight:700}
.opt.partner{background:var(--mint);border-color:transparent}.opt.partner .oi{background:#0f7a63}
.opt:focus-visible,.fab:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--app);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}

/* ---- SKINSIP Blue Lab theme: ice-blue ground, navy italic headlines, glass cards ---- */
:root,:root[data-theme=dark],:root[data-theme=light]{color-scheme:light;--bg:#e6f0fc;--app:#f5f9ff;--ink:#0b1f4f;--mute:#5b6f93;--line:#d5e4f7;--co:#1f3f9a;--co2:#e3effd;--mint:#e8f2ff;--coral:#4f9df0;--card:#ffffff}
body{background:radial-gradient(120% 60% at 10% 0%,#ffffff 0,#e9f2fd 45%,#d9e8fb 100%) fixed}
.app{background:linear-gradient(180deg,#f8fbff 0,#eef5ff 100%)}
@media(min-width:700px){.app{box-shadow:0 20px 60px rgba(31,63,154,.18)}}
h1,h2{font-style:italic;font-weight:700;color:var(--ink)}
.sky{background:linear-gradient(90deg,#3f8fea,#8cc2fb);-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{border-radius:999px;background:linear-gradient(135deg,#1f3f9a,#2f63d6);box-shadow:0 6px 16px rgba(31,63,154,.22)}
.btn.ghost,:root[data-theme=dark] .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.line{background:#06c755}
.top{background:rgba(255,255,255,.75);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{background:rgba(255,255,255,.85);backdrop-filter:blur(10px)}
.nav button.on,:root[data-theme=dark] .nav button.on{color:var(--co)}
.quick svg,:root[data-theme=dark] .quick svg{color:#3f8fea}
.quick button,.prod,.opt,.rec,.credit{background:#fff;border:1px solid var(--line);box-shadow:0 6px 18px rgba(31,63,154,.07)}
.quick button{border-radius:20px}
.prod{border-radius:20px}
.thumb{background:linear-gradient(160deg,#e3effd,#f7fbff)}
.add{background:linear-gradient(135deg,#1f3f9a,#2f63d6)}
.tag{background:#e3effd;color:var(--co)}
.tier{color:#3f8fea}
.av{background:#e3effd;color:var(--co)}
.refer{background:#eef5ff;border:1px solid var(--line)}
.chip,:root[data-theme=dark] .chip{border-color:#9cc4f5;color:var(--co);background:#fff}
.chip.on{background:var(--co);color:#fff}
.me{background:linear-gradient(135deg,#1f3f9a,#2f63d6)}
.bot{background:#fff;border:1px solid var(--line)}
.hero{background:linear-gradient(160deg,#d6e8ff 0,#f3f8ff 70%);color:var(--ink);border:1px solid #fff;box-shadow:inset 0 0 0 1px var(--line)}
.hero h1{color:var(--ink)}
.hero p{opacity:1;color:var(--mute)}
.hero .btn,.sbtn{background:linear-gradient(135deg,#1f3f9a,#2f63d6);color:#fff}
.fab{background:linear-gradient(135deg,#3f8fea,#1f3f9a);box-shadow:0 8px 22px rgba(31,63,154,.3)}
.oi{background:linear-gradient(135deg,#3f8fea,#1f3f9a)}.opt.partner{background:#eef5ff;border:1px solid var(--line)}.opt.partner .oi{background:#0f7a63}
.ok .ring{background:#e3effd;color:var(--co)}
.dot.on::after{background:var(--co)}
.steps .steps i,.steps i{background:#3f8fea}
.toast{background:var(--ink);color:#fff}
.brand{margin-left:auto;text-align:center;font-family:Prompt,sans-serif;font-weight:700;font-size:15px;line-height:1;color:var(--ink);letter-spacing:.02em}
.brand small{display:block;font-size:10px;font-weight:500;color:#3f8fea;letter-spacing:.08em;margin-top:2px}
.slide.pic{padding:0;min-height:0;aspect-ratio:4/5;background:#e3effd;border:1px solid #fff;box-shadow:0 10px 30px rgba(31,63,154,.14)}
.slide.pic img{position:static;width:100%;height:100%;object-fit:cover;display:block}
.sbtn.over{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);margin:0;white-space:nowrap;box-shadow:0 6px 16px rgba(31,63,154,.3)}
.ttl{font-size:20px}
.steps3{display:grid;gap:10px}
.st{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:20px;padding:12px 14px;box-shadow:0 6px 18px rgba(31,63,154,.07);font:inherit;color:inherit}
button.st{cursor:pointer}
.st i{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-style:italic;font-family:Prompt,sans-serif;font-weight:700;color:#fff;background:linear-gradient(135deg,#8cc2fb,#3f8fea)}
.st b{display:block;font-family:Prompt,sans-serif;font-style:italic;font-size:18px}
.st small{display:block;font-size:14px;color:var(--ink)}
.st em{display:block;font-style:normal;font-size:13px;color:var(--co);font-weight:600;margin-top:2px}.st em.m{color:var(--mute);font-weight:400}

/* ---- compact home ---- */
.home .member{margin-bottom:10px}
.hd2{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:16px 0 8px}
.hd2 .ttl{margin:0;font-size:19px}
.lnk{border:0;background:none;color:var(--co);font-weight:600;cursor:pointer;padding:6px 0;min-height:32px;font-size:14px}
.stories{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{flex:0 0 44%;max-width:190px;aspect-ratio:4/5;padding:0;border:1px solid #fff;border-radius:18px;overflow:hidden;scroll-snap-align:start;background:#e3effd;cursor:pointer;box-shadow:0 8px 20px rgba(31,63,154,.12)}
.story img{width:100%;height:100%;object-fit:cover;display:block}
.story:focus-visible{outline:3px solid #3f8fea;outline-offset:2px}
.steprow{display:flex;align-items:center;gap:6px;margin-top:6px}
.steprow>button,.steprow>div{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border:1px solid var(--line);background:#fff;border-radius:999px;font:italic 700 14px Prompt,sans-serif;color:var(--co);cursor:pointer;padding:0 8px}
.steprow>div{color:var(--mute);cursor:default}
.steprow i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:#fff;background:linear-gradient(135deg,#8cc2fb,#3f8fea);font-style:normal}
.steprow>span{color:#9cb5d9}
.pcards{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:8px}
.pc{position:relative;background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:4px;cursor:pointer;box-shadow:0 6px 18px rgba(31,63,154,.07);min-width:0}
.pc.hot{background:linear-gradient(170deg,#e1eeff,#fff 60%);border-color:#b9d5f7}
.pc .tag{position:absolute;top:8px;left:8px;margin:0;font-size:11px}
.pc .pa{height:84px;display:grid;place-items:center}
.pc b{font-size:13px;line-height:1.3}
.pc .pr{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-top:auto}
.pc .price{font-size:15px}
.pc .add{width:34px;height:34px;font-size:18px;flex:none}
.row2{display:flex;align-items:center;gap:10px;margin-top:12px}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.mini button{display:flex;align-items:center;gap:8px;min-height:52px;padding:0 12px;border:1px solid var(--line);background:#fff;border-radius:16px;cursor:pointer;font-size:14px;color:var(--ink);text-align:left}
.mini svg{width:22px;height:22px;color:#3f8fea;flex:none}
.lb{position:fixed;inset:0;z-index:30;background:rgba(11,31,79,.72);backdrop-filter:blur(6px)}
.lb[hidden]{display:none}
.lbtrack{position:absolute;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.lbtrack::-webkit-scrollbar{display:none}
.lbs{flex:0 0 100%;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:56px 16px 24px}
.lbs img{max-width:min(100%,460px);max-height:calc(100% - 70px);border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.lbx{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;border:0;background:#fff;color:var(--ink);font-size:18px;cursor:pointer}
.lbn{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:var(--ink);font-size:24px;cursor:pointer}
.lbn.p{left:10px}.lbn.n{right:10px}
@media(max-width:520px){.lbn{display:none}}

/* ---- navy tab bar ---- */
.nav{background:linear-gradient(180deg,#14307a,#0b1f4f);backdrop-filter:none;border-top:0;box-shadow:0 -6px 20px rgba(11,31,79,.18)}
.nav button,:root[data-theme=dark] .nav button{color:rgba(255,255,255,.62);position:relative}
.nav button.on,:root[data-theme=dark] .nav button.on{color:#fff}
.nav button.on::before{content:"";position:absolute;top:0;left:50%;width:28px;height:3px;border-radius:0 0 4px 4px;background:#8cc2fb;transform:translateX(-50%)}
.nav button.on svg{color:#8cc2fb}
.nav button:focus-visible{outline:2px solid #8cc2fb;outline-offset:-4px}
.badge{background:#5aa9f5}
.fab{background:linear-gradient(135deg,#6db4f7,#3f8fea);box-shadow:0 8px 22px rgba(63,143,234,.4)}

.swrap{position:relative}
.stories{cursor:grab}.stories:active{cursor:grabbing}
.story img{-webkit-user-drag:none;user-select:none;pointer-events:none}
.sarr{position:absolute;top:calc(50% - 22px);width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.92);color:var(--co);font-size:22px;line-height:1;cursor:pointer;box-shadow:0 4px 12px rgba(31,63,154,.15);display:none}
.sarr.l{left:-6px}.sarr.r{right:-6px}

html,body{height:100%}
.app{height:100vh;height:100dvh;min-height:0}

main{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:24px}
main.home{padding-bottom:90px}
.top,.nav{flex:none}
.nav{position:static}
.fab{position:absolute;right:16px;bottom:78px;margin:0}

<body>
<div class="app" id="app"></div>
<div class="toast" id="toast" role="status"></div>
<div class="scrim" id="sheet" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shT"><div class="grab"></div><h3 id="shT">ติดต่อเรา</h3>
<button class="opt" data-act="sAdmin"><span class="oi">A</span><span><b>คุยกับแอดมิน SKINSIP</b><small>สอบถามออเดอร์ การจัดส่ง ตัวแทน · ตอบใน LINE@</small></span></button>
<button class="opt" data-act="sBot"><span class="oi">B</span><span><b>ถามบอทเรื่องสินค้า</b><small>เลือกสินค้า ส่วนผสม วิธีใช้ · ตอบทันที</small></span></button>
<button class="opt partner" data-act="derlain"><span class="oi">D</span><span><b>ปรึกษาแพทย์ผิวหนัง</b><small>Derlain Clinic คลินิกพันธมิตร · เปิดใน LINE ของคลินิก</small></span></button>
<button class="btn ghost" data-act="close">ปิด</button></div></div>
<script>
{
const P=[
 {id:'gel',name:'SKINSIP Barrier Repair Gel',short:'เจลซ่อมเกราะผิว',price:490,pcs:1,shape:'tube',desc:'สเต็ป 2 Repair · เจลบำรุงเนื้อบางเบา เติมความชุ่มชื้นและเสริมเกราะป้องกันผิวให้แข็งแรง สบายผิว ไม่เหนอะหนะ',use:'ทาบางๆ หลังล้างหน้า เช้าและเย็น'},
 {id:'mousse',name:'SKINSIP Barrier Comfort Cleansing Mousse',short:'มูสล้างหน้าอ่อนโยน',price:390,pcs:1,shape:'bottle',desc:'สเต็ป 1 Cleanse · มูสล้างหน้าฟองนุ่ม ทำความสะอาดอย่างอ่อนโยน ไม่ทำลายน้ำมันธรรมชาติบนผิว',use:'กด 1–2 ครั้ง นวดเบาๆ แล้วล้างออก'},
 {id:'duo',name:'SKINSIP Barrier Duo',short:'เซ็ตคู่ เจล + มูส',price:790,pcs:2,shape:'duo',desc:'Cleanse + Repair ครบ 2 สเต็ปแรกของการกู้ผิวฉบับ Less But Better ล้างอ่อนโยนแล้วเติมเกราะผิว',use:'เช้า–เย็น: มูส แล้วตามด้วยเจล'}
];
const S={view:'login',tab:'home',user:null,cart:{},orders:[],sel:null,chat:[],ref:'',filter:'ทั้งหมด',agent:false,approved:false,points:0,back:null};
const CODES=['SK001','SK002','SK003','SK004','SK005','SK006','SK007','SK008','SK009'];
const RATE=40;
const tell=m=>{try{if(window.parent!==window)window.parent.postMessage(m,'*')}catch(e){}};
/* ---------- Firebase ---------- */
let FB=null,UID=null;S.myCode='';S.affStats=null;
try{firebase.initializeApp({apiKey:"AIzaSyCsiAtzebRIGYjAdZwXhxDt65-K4F7ewWY",authDomain:"skinsip.firebaseapp.com",projectId:"skinsip",storageBucket:"skinsip.firebasestorage.app",messagingSenderId:"514941349392",appId:"1:514941349392:web:9f12d31e39139f90e26495"});FB=firebase.firestore();
 firebase.auth().onAuthStateChanged(u=>{if(!u){firebase.auth().signInAnonymously().catch(()=>{});return}UID=u.uid;listen()});}catch(e){FB=null}
const LIVE_VIEWS=['home','orders','agent','done','me'];
const listen=()=>{
 FB.collection('orders').where('uid','==',UID).onSnapshot(snap=>{
  const L=snap.docs.map(d=>{const x=d.data({serverTimestamps:'estimate'});const lines={};for(const p of P)if(x.lines&&+x.lines[p.id]>0)lines[p.id]=+x.lines[p.id];
   return {no:String(x.no||d.id),date:x.createdAt?x.createdAt.toMillis():Date.now(),items:Object.entries(lines).map(([k,q])=>P.find(p=>p.id===k).short+' ×'+q).join(', '),lines,pcs:Object.entries(lines).reduce((a,[k,q])=>a+P.find(p=>p.id===k).pcs*q,0),total:+x.total||0,discount:+x.discount||0,pm:String(x.pm||''),status:String(x.status||''),tracking:String(x.tracking||''),ref:String(x.ref||''),member:!!x.member,earn:x.member?Math.floor((+x.total||0)/10):0}}).sort((a,b)=>b.date-a.date);
  const prev={};S.orders.forEach(o=>prev[o.no]=o.status);
  L.forEach(o=>{if(prev[o.no]&&prev[o.no]!==o.status)toast('แจ้งเตือน: '+o.no+' '+o.status)});
  S.orders=L;S.points=L.filter(o=>o.member&&o.status!=='คืนสินค้า').reduce((a,o)=>a+o.earn,0)-L.reduce((a,o)=>a+o.discount*10,0);
  if(LIVE_VIEWS.includes(S.view))render()},()=>{});
 FB.collection('affiliates').where('uid','==',UID).onSnapshot(snap=>{const d=snap.docs[0];if(!d)return;const x=d.data();S.agent=true;
  const was=S.approved;S.approved=x.status==='อนุมัติแล้ว'&&/^SK\d{3,}$/.test(x.code||'');S.myCode=S.approved?x.code:'';S.affStats=x.stats||null;
  if(S.approved&&!was)toast('อนุมัติแล้ว โค้ดของคุณคือ '+S.myCode);if(LIVE_VIEWS.includes(S.view))render()},()=>{});
};
const fbOrder=o=>{if(!FB||!UID)return toast('ยังเชื่อมระบบไม่ได้ ออเดอร์นี้ยังไม่ถูกบันทึก');
 FB.collection('orders').add({no:o.no,uid:UID,lines:o.lines,total:o.total,discount:o.discount,pm:o.pm,ref:o.ref,status:'รอจัดส่ง',customer:{name:o.customer.name,phone:o.customer.phone,address:o.customer.address},createdAt:firebase.firestore.FieldValue.serverTimestamp(),member:!!o.customer.member}).catch(e=>toast('บันทึกออเดอร์ไม่สำเร็จ: '+(e.code||'')))};
const fbAff=f=>{if(!FB||!UID)return;FB.collection('affiliates').add({...f,status:'รออนุมัติ',uid:UID,createdAt:firebase.firestore.FieldValue.serverTimestamp()}).catch(e=>toast('ส่งใบสมัครไม่สำเร็จ: '+(e.code||'')))};
const $=id=>document.getElementById(id);
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const baht=n=>'฿'+n.toLocaleString('th-TH');
const toast=t=>{const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1800)};
const cartN=()=>Object.values(S.cart).reduce((a,b)=>a+b,0);
const cartSum=()=>Object.entries(S.cart).reduce((a,[k,q])=>a+P.find(p=>p.id===k).price*q,0);
const tube=(w=70)=>`<svg viewBox="0 0 60 100" width="${w}" aria-hidden="true"><path d="M14 8h32l-3 70H17z" fill="#fff" stroke="#1f3f9a" stroke-width="2"/><path d="M14 8h32v8H14z" fill="#1f3f9a"/><rect x="22" y="78" width="16" height="16" rx="3" fill="#1f3f9a"/><rect x="19" y="36" width="22" height="22" rx="3" fill="#e3effd"/><circle cx="30" cy="47" r="5" fill="#5aa9f5"/><path d="M40 16l-2 62" stroke="#e2e5f0" stroke-width="3"/></svg>`;
const bottle=(w=70)=>`<svg viewBox="0 0 60 100" width="${w}" aria-hidden="true"><rect x="24" y="4" width="8" height="10" fill="#1f3f9a"/><path d="M32 8h12v5H32z" fill="#1f3f9a"/><rect x="20" y="14" width="16" height="10" rx="2" fill="#1f3f9a"/><rect x="12" y="24" width="32" height="70" rx="10" fill="#fff" stroke="#1f3f9a" stroke-width="2"/><rect x="17" y="44" width="22" height="26" rx="3" fill="#e3effd"/><circle cx="28" cy="57" r="5" fill="#5aa9f5"/><path d="M38 30v58" stroke="#e2e5f0" stroke-width="3"/></svg>`;
const art=(p,w)=>p.shape==='tube'?tube(w):p.shape==='bottle'?bottle(w):`<span style="display:flex;align-items:flex-end">${tube(w*.62)}${bottle(w*.62)}</span>`;
const I={home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',shop:'<path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2"/>',chat:'<path d="M4 5h16v11H9l-5 4z"/><path d="M8 10h8"/>',play:'<rect x="4" y="3" width="16" height="18" rx="3"/><path d="M10 9l5 3-5 3z"/>',me:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',agent:'<path d="M12 3l2.5 5 5.5.8-4 3.9 1 5.5L12 15.6 7 18.2l1-5.5-4-3.9L9.5 8z"/>',doc:'<path d="M12 3c-3 4-6 6-6 10a6 6 0 0 0 12 0c0-4-3-6-6-10z"/>'};
const ic=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">${I[k]}</svg>`;
const top=(t,back)=>`<div class="top">${back?`<button class="back" data-go="${back}" aria-label="ย้อนกลับ">‹</button>`:''}<h3>${t}</h3></div>`;

const SLIDES=[
 {img:'img/s1.webp',alt:'คุณไม่ได้ผิวแพ้ง่าย แต่แค่เกราะผิวพังหรือเปล่า'},
 {img:'img/s2.webp',alt:'แต่งหน้าไม่ติด รองพื้นเป็นคราบ เกราะป้องกันผิวกำลังอ่อนแอ'},
 {img:'img/s3.webp',alt:'ผิวพังซ้ำซาก ควรประโคมต่อหรือพักหน้า'},
 {img:'img/s4.webp',alt:'ถ้าเลือกประโคมต่อ ผิวยิ่งระคายเคือง'},
 {img:'img/s5.webp',alt:'ถ้าเลือกพักหน้า ผิวแห้งลอก หน้ามันขาดน้ำ'},
 {img:'img/s6.webp',alt:'รู้จักเกราะป้องกันผิว Skin Barrier'},
 {img:'img/s7.webp',alt:'ผิวมันก็ต้องการความชุ่มชื้น'},
 {img:'img/s8.webp',alt:'3 สเต็ปกู้ผิวฉบับ Less But Better',a:'data-p="duo"',b:'เริ่มด้วย Barrier Duo'}
];

const slider=()=>`<div class="stories" id="track">${SLIDES.map((x,i)=>`<button class="story" data-story="${i}" aria-label="เปิดภาพ ${i+1}: ${x.alt}"><img src="${x.img}" alt="${x.alt}" loading="${i<2?'eager':'lazy'}"></button>`).join('')}</div>`;
const lbHtml=()=>`<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="ภาพความรู้เรื่องเกราะผิว"><div class="lbtrack" id="lbtrack">${SLIDES.map((x,i)=>`<div class="lbs"><img src="${x.img}" alt="${x.alt}" loading="lazy">${x.b?`<button class="sbtn" ${x.a} data-lbclose>${x.b}</button>`:''}</div>`).join('')}</div><button class="lbx" data-lbclose aria-label="ปิด">✕</button><button class="lbn p" data-lbnav="-1" aria-label="ภาพก่อนหน้า">‹</button><button class="lbn n" data-lbnav="1" aria-label="ภาพถัดไป">›</button></div>`;
const V={
login:()=>`<main style="padding-bottom:30px"><div class="hero" style="min-height:300px;margin-top:10px"><h1>SKINSIP</h1><p>ดูแลเกราะผิวทุกวัน ซื้อสินค้า ถามข้อมูล และติดตามออเดอร์ได้ในที่เดียว</p><svg viewBox="0 0 120 140" preserveAspectRatio="xMidYMax meet">${'<g transform="translate(6 30) scale(1.1)">'+tube(60).replace(/<\/?svg[^>]*>/g,'')+'</g><g transform="translate(56 40) scale(1)">'+bottle(60).replace(/<\/?svg[^>]*>/g,'')+'</g>'}</svg></div>
<button class="btn line" data-act="line">เข้าสู่ระบบด้วย LINE</button><button class="btn ghost" data-act="guest">ดูสินค้าก่อน (ไม่ต้องสมัคร)</button><p class="note">ต้นแบบ: ปุ่ม LINE จำลองการดึงชื่อจากบัญชี LINE</p></main>`,
signup:()=>`${top('สมัครสมาชิก','login')}<main><div class="steps"><i style="width:50%"></i></div><p class="mute">ได้ชื่อจาก LINE แล้ว กรอกเพิ่มอีกนิดเพื่อจัดส่งและติดตามออเดอร์</p>
<form id="fSign"><label for="nm">ชื่อ–นามสกุล *</label><input id="nm" required value="${esc(S.user?.name||'')}" autocomplete="name">
<label for="ph">เบอร์โทรศัพท์ *</label><input id="ph" required inputmode="tel" placeholder="08X-XXX-XXXX" pattern="0[0-9]{2}-?[0-9]{3}-?[0-9]{4}">
<label for="em">อีเมล</label><input id="em" type="email" placeholder="name@email.com">
<label for="bd">วันเกิด (ไม่บังคับ)</label><input id="bd" type="date">
<label class="check"><input type="checkbox" id="c1" required>ยอมรับเงื่อนไขการใช้บริการและนโยบายความเป็นส่วนตัว *</label>
<label class="check"><input type="checkbox" id="c2">ยินยอมรับข่าวสารและโปรโมชั่นผ่าน LINE</label>
<button class="btn" type="submit">รับรหัส OTP</button></form></main>`,
otp:()=>`${top('ยืนยันเบอร์โทร','signup')}<main><div class="steps"><i style="width:100%"></i></div><p>ส่งรหัส 6 หลักไปที่ <b>${esc(S.user.phone)}</b></p><div class="otp">${[0,1,2,3,4,5].map(i=>`<input id="o${i}" inputmode="numeric" maxlength="1" aria-label="รหัสหลักที่ ${i+1}">`).join('')}</div><button class="btn" data-act="otp">ยืนยัน</button><p class="note">ต้นแบบ: ใส่เลขอะไรก็ได้ 6 หลัก</p></main>`,
home:()=>`<main class="home"><div class="member"><div class="av">${esc((S.user?.name||'ผ')[0])}</div><div style="flex:1"><b>${S.user?esc(S.user.name):'ผู้เยี่ยมชม'}</b><div class="tier">${S.user?`SILVER MEMBER · ${S.points.toLocaleString()} แต้ม`:'ยังไม่ได้เข้าสู่ระบบ'}</div></div><div class="brand">SKINSIP<small>BLUE LAB</small></div></div>
<div class="hd2"><h2 class="ttl">เกราะผิว<span class="sky">อ่อนแอ</span>หรือเปล่า?</h2><span class="small">แตะเพื่ออ่าน</span></div>
<div class="swrap">${slider()}<button class="sarr l" data-sgo="-1" aria-label="เลื่อนซ้าย">‹</button><button class="sarr r" data-sgo="1" aria-label="เลื่อนขวา">›</button></div>
<div class="steprow" aria-label="3 สเต็ปกู้ผิว Less But Better"><button data-p="mousse"><i>1</i>Cleanse</button><span>›</span><button data-p="gel"><i>2</i>Repair</button><span>›</span><div><i>3</i>Protect</div></div>
<div class="hd2"><h2 class="ttl">ช้อป <span class="sky">Less But Better</span></h2><button class="lnk" data-tab="shop">ดูทั้งหมด ›</button></div>
<div class="pcards">${['duo','gel','mousse'].map(id=>{const p=P.find(x=>x.id===id);return `<div class="pc${id==='duo'?' hot':''}" data-p="${p.id}" role="button" tabindex="0">${id==='duo'?'<span class="tag">คุ้มสุด</span>':''}<div class="pa">${art(p,id==='duo'?70:56)}</div><b>${p.short}</b><div class="pr"><span class="price">${baht(p.price)}</span><button class="add" data-add="${p.id}" aria-label="ใส่ตะกร้า ${p.short}">+</button></div></div>`}).join('')}</div>
${S.orders.length?`<div class="refer row2"><div style="flex:1"><b>ใกล้หมดหรือยัง?</b><div class="small" style="color:inherit">${esc(S.orders[0].items)} · สั่งชุดเดิมได้ในคลิกเดียว</div></div><button class="sbtn" style="margin:0" data-reorder="0">สั่งซ้ำ</button></div>`:''}
<div class="mini"><button data-tab="reviews">${ic('play')}<span>รีวิวผู้ใช้</span></button><button data-go="agent">${ic('agent')}<span>${S.approved?'แดชบอร์ดตัวแทน':'ชวนเพื่อนรับค่าคอม'}</span></button></div>
</main><button class="fab" data-act="fab" aria-label="ติดต่อเรา">${ic('chat')}<span>แชท</span></button>`,

shop:()=>`${top('ร้านค้า SKINSIP')}<main><p class="small">ราคาในต้นแบบเป็นราคาตัวอย่าง แอดมินกำหนดจริงในหลังบ้าน</p>${plist()}${cartN()?`<button class="btn" data-go="cart">ไปที่ตะกร้า (${cartN()}) · ${baht(cartSum())}</button>`:''}</main>`,
product:()=>{const p=P.find(x=>x.id===S.sel);return `${top(p.short,S.back||'shop')}<main><div class="big">${art(p,150)}</div><h2>${p.name}</h2><p class="price" style="font-size:24px">${baht(p.price)}</p><p>${p.desc}</p><p class="mute">วิธีใช้: ${p.use}</p>${p.id==='duo'?'<span class="tag">คุ้มกว่าซื้อแยก '+baht(P[0].price+P[1].price-p.price)+'</span>':''}<button class="btn" data-add="${p.id}">ใส่ตะกร้า</button><button class="btn ghost" data-tab="consult">ไม่แน่ใจ? ถามบอทก่อน</button></main>`},
cart:()=>{const it=Object.entries(S.cart);return `${top('ตะกร้า','shop')}<main>${it.length?it.map(([k,q])=>{const p=P.find(x=>x.id===k);return `<div class="row" style="align-items:center"><div style="flex:1"><b style="white-space:normal">${p.short}</b><div class="small">${baht(p.price)}</div></div><div class="qty"><button data-q="${k}" data-d="-1" aria-label="ลด">−</button><span>${q}</span><button data-q="${k}" data-d="1" aria-label="เพิ่ม">+</button></div></div>`}).join('')+`<div class="row"><span>รวม</span><b>${baht(cartSum())}</b></div><button class="btn" data-go="checkout">ชำระเงิน</button>`:'<p class="mute">ตะกร้าว่าง</p><button class="btn" data-tab="shop">เลือกสินค้า</button>'}</main>`},

 initSlider();

let sTimer=null;
const initSlider=()=>{clearInterval(sTimer);const tr=$('track');if(!tr||!tr.classList.contains('stories'))return;
 const items=[...tr.children];const step=()=>items[1]?items[1].offsetLeft-items[0].offsetLeft:tr.clientWidth;
 const go=d=>{const max=tr.scrollWidth-tr.clientWidth;const nx=tr.scrollLeft+d*step();tr.scrollTo({left:d>0&&tr.scrollLeft>=max-4?0:Math.max(0,nx),behavior:'smooth'})};
 tr._go=go;let pause=0;const hold=()=>{pause=Date.now()+6000};
 ['pointerdown','wheel','touchstart','focusin'].forEach(ev=>tr.addEventListener(ev,hold,{passive:true}));
 /* mouse drag to slide on computers */
 let dn=null,moved=false;tr.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')return;dn={x:e.clientX,l:tr.scrollLeft};moved=false;tr.style.scrollSnapType='none'});
 window.addEventListener('pointermove',e=>{if(!dn)return;const dx=e.clientX-dn.x;if(Math.abs(dx)>5)moved=true;tr.scrollLeft=dn.l-dx});
 window.addEventListener('pointerup',()=>{if(!dn)return;dn=null;tr.style.scrollSnapType='';const s=step();tr.scrollTo({left:Math.round(tr.scrollLeft/s)*s,behavior:'smooth'})});
 tr.addEventListener('click',e=>{if(moved){e.stopPropagation();e.preventDefault();moved=false}},true);
 if(!matchMedia('(prefers-reduced-motion: reduce)').matches)sTimer=setInterval(()=>{if(!document.body.contains(tr)){clearInterval(sTimer);return}if(Date.now()<pause||document.hidden||($('lb')&&!$('lb').hidden))return;go(1)},3500)};
const lbOpen=n=>{let lb=$('lb');if(!lb){document.body.insertAdjacentHTML('beforeend',lbHtml());lb=$('lb')}lb.hidden=false;const tr=$('lbtrack');requestAnimationFrame(()=>{tr.scrollLeft=n*tr.clientWidth});lb.querySelector('.lbx').focus()};
const lbClose=()=>{const lb=$('lb');if(lb)lb.hidden=true};
const lbNav=d=>{const tr=$('lbtrack');const c=Math.round(tr.scrollLeft/tr.clientWidth);tr.scrollTo({left:Math.max(0,Math.min(SLIDES.length-1,c+d))*tr.clientWidth,behavior:'smooth'})};

 const t=e.target.closest('[data-tab],[data-go],[data-act],[data-add],[data-p],[data-q],[data-bot],[data-f]');if(!t)return;
 const d=t.dataset;
 if(d.add){e.stopPropagation();S.cart[d.add]=(S.cart[d.add]||0)+1;toast('ใส่ตะกร้าแล้ว');if(d.buy){go('cart')}else render();return}
 if(d.tab)return go(d.tab);
 if(d.go){if(d.go==='product')return;S.back=null;return go(d.go)}
 if(d.p){S.sel=d.p;S.back=S.view;S.view='product';return render()}
 if(d.q){S.cart[d.q]+=+d.d;if(S.cart[d.q]<=0)delete S.cart[d.q];return render()}
 if(d.f){S.filter=d.f;return render()}
 if(d.bot){S.chat.forEach(m=>m.last=false);S.chat.push({me:true,t:d.l});return bot(d.bot)}
 const a=d.act;
 if(a==='line'){S.user={name:'คุณสมาธิ',phone:''};return go('signup')}
 if(a==='guest')return go('home');
 if(a==='otp'){const v=[0,1,2,3,4,5].map(i=>$('o'+i).value).join('');if(!/^\d{6}$/.test(v))return toast('กรอกรหัสให้ครบ 6 หลัก');toast('สมัครสมาชิกสำเร็จ');return go('home')}
 if(a==='logout'){S.user=null;return go('login')}
 if(a==='admin'){S.view='consult';S.tab='consult';if(!S.chat.length)render();S.chat.forEach(m=>m.last=false);S.chat.push({me:true,t:'คุยกับแอดมิน'});return bot('admin')}
 if(a==='approve'){S.approved=true;toast('อนุมัติแล้ว โค้ดของคุณคือ '+S.myCode);return render()}
 if(a==='copycode'){try{navigator.clipboard.writeText('?ref='+S.myCode).then(()=>toast('คัดลอกแล้ว'),()=>toast('คัดลอกไม่ได้ในหน้านี้'))}catch(err){toast('คัดลอกไม่ได้ในหน้านี้')}return}
 if(a==='sharel')return toast('ต้นแบบ: เปิดหน้าต่างเลือกเพื่อนใน LINE');
 if(a==='media')return toast('ต้นแบบ: เปิดคลังสื่อแบรนด์');
 if(a==='addfriend')return toast('ต้นแบบ: เปิดหน้าเพิ่มเพื่อน LINE@');
 if(a==='derlain'){closeSheet();return toast('ต้นแบบ: เปิด LINE OA ของ Derlain Clinic')}
 if(a==='fab'){$('sheet').hidden=false;$('sheet').querySelector('button').focus();return}
 if(a==='close')return closeSheet();
 if(a==='sAdmin'){closeSheet();S.view='consult';S.tab='consult';if(!S.chat.length)render();S.chat.forEach(m=>m.last=false);S.chat.push({me:true,t:'คุยกับแอดมิน'});return bot('admin')}
 if(a==='sBot'){closeSheet();return go('consult')}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSheet();lbClose()}if($('lb')&&!$('lb').hidden){if(e.key==='ArrowRight')lbNav(1);if(e.key==='ArrowLeft')lbNav(-1)}if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.p){S.sel=e.target.dataset.p;S.back=S.view;S.view='product';render()}});
document.addEventListener('input',e=>{const m=/^o(\d)$/.exec(e.target.id);if(m&&e.target.value&&+m[1]<5)$('o'+(+m[1]+1)).focus()});
document.addEventListener('submit',e=>{e.preventDefault();const id=e.target.id;
 if(id==='fSign'){S.user={name:$('nm').value.trim(),phone:$('ph').value.trim()};return go('otp')}
 if(id==='fPay'){const ref=$('rc').value.trim().toUpperCase();const pm=document.querySelector('input[name=pm]:checked').value;
  const okRef=/^SK\d{3,}$/.test(ref)&&ref!==S.myCode;
  const lines={...S.cart};const items=Object.entries(lines).map(([k,q])=>P.find(p=>p.id===k).short+' ×'+q).join(', ');
  const pcs=Object.entries(lines).reduce((a,[k,q])=>a+P.find(p=>p.id===k).pcs*q,0);
  const use=$('usePts')&&$('usePts').checked?ptsDisc():0;const total=cartSum()-use;const earn=Math.floor(total/10);
  S.points=S.points-use*10+(S.user?earn:0);
  const o={no:'SKS'+String(20001+Math.floor(Math.random()*8999)),date:new Date().toISOString(),items,lines,pcs,total,discount:use,pm,status:'รอจัดส่ง',ref:okRef?ref:'',earn:S.user?earn:0,
   customer:{name:$('an').value.trim(),phone:$('ap').value.trim(),address:$('ad').value.trim(),member:!!S.user}};
  S.orders.unshift(o);tell({type:'skinsip-order',order:o});fbOrder(o);
  if(ref&&!okRef)toast('โค้ดไม่ถูกต้องหรือเป็นโค้ดของคุณเอง บันทึกเป็นออเดอร์ขายตรง');S.ref=ref;S.cart={};return go('done')}
 if(id==='fAg'){S.agent=true;fbAff({name:$('gn').value.trim(),phone:$('gp').value.trim(),channel:$('gc').value,link:$('gl').value.trim(),followers:$('gf').value});return render()}
});
window.addEventListener('message',e=>{const m=e.data;if(!m||m.type!=='skinsip-status')return;const o=S.orders.find(x=>x.no===m.no);if(!o)return;o.status=m.status;if(m.tracking)o.tracking=m.tracking;toast('แจ้งเตือน LINE: '+o.no+' '+m.status);render()});
render();
}
</script>
</body>
</html>
